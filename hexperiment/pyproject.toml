[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexperiment"
version = "0.1.0"
description = "A leakage-proof ML kit: if your model looks too good to be true, it's haunted."
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
dev = [
    "pytest",
    "pytest-xdist==3.8.0",
    "hypothesis",
    "ruff",
    "hexperiment[mcp]",
]

[project.scripts]
hexperiment = "hexperiment.entry:main"
hexperiment-mcp = "hexperiment.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hexperiment = ["templates/**/*"]
"hexperiment.gallery" = ["assets/*.css", "assets/fonts/*"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The canary scenarios spawn real training runs; spread them across CPU cores.
addopts = "-n auto --dist loadscope"
